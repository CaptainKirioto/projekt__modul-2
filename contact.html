<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Contact</title>
</head>
<body>
    <nav>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="#">Paranormal Categories</a></li>
            <li><a href="#">Books</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="./contact.html">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h2 class="contact-head">Contact Us</h2>
        
        <form class="contact-form">
            <div class="contact-input-container">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Lisa" class="contact-input" required>
            </div>
        
            <div class="contact-input-container">
                <label for="l-name">Last Name:</label>
                <input type="text" id="l-name" name="l-name" placeholder="Simpson" class="contact-input" required>
            </div>
        
            <div class="contact-input-container">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="jazz4life@mail.com" class="contact-input" required>
            </div>
        
            <div class="contact-input-container">
                <label for="message">Message:</label>
                <textarea id="message" name="message" class="contact-input" placeholder="Deine Nachricht..." required>
                          </textarea>
            </div>
        
            <button type="submit" class="contact-button">
                Send
            </button>
        
        </form>
    </main>
    <footer>
        <p>Our Social Media:</p>
        <ul>
            <li><a href="#">Instagram</a></li>
            <li><a href="#">Pinterest</a></li>
            <li><a href="#">Substack</a></li>
        </ul>
    
    </footer>
</body>
</html>
